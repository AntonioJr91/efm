services:
  api:
    build: .
    container_name: efm-api
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/efm}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-never}
      JWT_RSA_PRIVATE_KEY: ${JWT_RSA_PRIVATE_KEY:-classpath:api-dev.pri}
      JWT_RSA_PUBLIC_KEY: ${JWT_RSA_PUBLIC_KEY:-classpath:api-dev.pub}
      EFM_DOCKER_ADMIN_USERNAME: ${EFM_DOCKER_ADMIN_USERNAME:-admin}
      EFM_DOCKER_ADMIN_PASSWORD: ${EFM_DOCKER_ADMIN_PASSWORD:-admin}

  mysql:
    image: mysql:8.0
    container_name: efm-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-efm}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
